<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zodiac Ascendant Codex</title>
  <meta name="description" content="Browse every beast, vessel spirit, Keeper card, material and recipe in the Zodiac Ascendant open game data.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23b8322a'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23f6e7cf' font-family='serif'%3E%E5%8D%81%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="seal" aria-hidden="true">十</span>
      <div>
        <h1>Zodiac Ascendant Codex</h1>
        <p class="tag">Beasts of the Five Elements · open game data <span id="version"></span></p>
      </div>
    </div>
    <label class="search">
      <span class="visually-hidden">Search</span>
      <input id="q" type="search" placeholder="Search names, lore, effects…" autocomplete="off">
    </label>
  </header>

  <nav class="filters" aria-label="Filters">
    <div class="tabs" id="types" role="tablist"></div>
    <div class="row">
      <div class="chips" id="elements" aria-label="Element"></div>
      <label class="sort">Sort
        <select id="sort">
          <option value="codex">Codex order</option>
          <option value="name">Name</option>
          <option value="weight">Average weight</option>
          <option value="dc">Difficulty</option>
        </select>
      </label>
    </div>
  </nav>

  <main>
    <p class="count" id="count" aria-live="polite"></p>
    <section class="grid" id="grid"></section>
  </main>

  <dialog id="detail" aria-labelledby="d-name"></dialog>

  <footer class="foot">
    Game content CC BY 4.0 · code MIT · illustrations are generated drafts.
    <a href="data/cards.json">cards.json</a> · <a href="data/drafts/">draft JSON</a>
  </footer>
  <script src="viewer.js" defer></script>
</body>
</html>
