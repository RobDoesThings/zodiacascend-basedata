name: Generate card art

# Run from the Actions tab: Generate card art → Run workflow.
# Needs a repository secret named BFL_API_KEY (Settings → Secrets and variables → Actions).
# New images are committed to art/generated/, and the Pages site redeploys afterwards.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max images this run (blank = all missing). Start with 3 to check the style."
        default: "3"
        required: false
      type:
        description: "Only this kind of card"
        type: choice
        default: all
        options: [all, zodiac, wanderer, spirit, card]
      only:
        description: "Comma-separated card ids (optional), e.g. torakai,suerak"
        required: false
      stale:
        description: "Also redo images whose prompt changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run drafts
      - name: Generate images
        env:
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          TYPE: ${{ inputs.type }}
          ONLY: ${{ inputs.only }}
          STALE: ${{ inputs.stale }}
        run: |
          args=()
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          [ "$TYPE" != "all" ] && args+=(--type "$TYPE")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$STALE" = "true" ] && args+=(--stale)
          npm run art:ai -- "${args[@]}"
      - name: Commit new images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/generated art/prompts.json
          if git diff --cached --quiet; then echo "No new images."; exit 0; fi
          git commit -m "Generate card art ($(git diff --cached --name-only -- 'art/generated/*.jpg' | wc -l) images)"
          git push
