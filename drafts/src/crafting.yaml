# DRAFT for review. Crafting: Keeper disciplines, how a crafting check works, how beasts help,
# and recipes for Keeper armour, beast armour and charms.

check:
  roll: d20 + discipline ability modifier + Rank (if proficient in the discipline) vs recipe DC
  rank_source: The Keeper's Rank, from the same level table as beasts (data/rules.yaml).
  time: Each recipe lists working days. Two Keepers working together halve it (round up).
  outcomes:
    - { id: ruined, when: "Fail by 5 or more", result: "All materials are lost." }
    - { id: failed, when: "Fail by 1–4", result: "No progress; half the materials (round down) are lost." }
    - { id: standard, when: "Meet the DC", result: "The piece is made." }
    - { id: fine, when: "Beat the DC by 5 or more", result: "+2 durability, and pick one: −1 weight class step for Speed purposes, or +1 to the material's special effect." }
    - { id: masterwork, when: "Beat the DC by 10 or more, or a natural 20 that also meets the DC", result: "Fine, plus an inscription slot for a talisman charm (see charms)." }

# Combining materials of different elements in one piece.
element_synergy:
  one_generates_the_other: { dc_change: -2, note: "The materials feed each other, e.g. Wood frame with Fire padding." }
  one_controls_the_other: { dc_change: 3, note: "The materials fight, e.g. Metal facing on a Wood frame." }
  same_element: { dc_change: 0 }
  untyped: { dc_change: 0 }
  rule: Compare every pair of typed materials in the recipe; apply each change once per distinct pair.

# Tier of the best material sets a floor on the DC.
tier_dc_floor: { 1: 10, 2: 13, 3: 16, 4: 19 }

disciplines:
  - id: weaving
    name: Weaving
    ability: DEX
    tools: Loom, rattan knife, needles
    makes: Quilted coats, rattan and paper armour, feather mantles, silk padding, collars.
  - id: hidework
    name: Hidework
    ability: DEX
    tools: Awls, scrapers, tanning vats
    makes: Fish leather, tanned hides, scale sheaths, straps and lacing.
  - id: smithing
    name: Smithing
    ability: STR
    tools: Forge, anvil, hammers, quench trough
    makes: Lamellar plates, plate barding, horn caps, metal fittings.
  - id: lacquerwork
    name: Lacquerwork
    ability: WIS
    tools: Brushes, curing cabinet, polishing stones
    makes: Lacquer finishes, shell facing, inlay. Needs patience; each coat cures for a day.
  - id: kilnwork
    name: Kilnwork
    ability: INT
    tools: Kiln, glazes, moulds
    makes: Glazed tiles, ceramic plates, clay jars and pillow boxes (vessels).
  - id: talisman-carving
    name: Talisman Carving
    ability: WIS
    tools: Fine chisels, brushes, cinnabar ink
    makes: Charms, peach-wood and jade talismans, inscriptions on masterwork pieces.
  - id: beastwright
    name: Beastwright
    ability: WIS
    tools: Measuring cords, padding, fitting frame
    makes: Fits any beast armour to a body plan marked "adapted"; refits armour after a beast evolves.

# Keeper class links (proposed; classes are designed in Phase 6).
class_disciplines:
  artisan: Proficient in three disciplines at level 1 and adds a fourth at level 5. Halves crafting time.
  warden: Proficient in Smithing.
  sage: Proficient in Talisman Carving.
  wayfarer: Proficient in Hidework.
  envoy: Proficient in Weaving.
  seeker: Proficient in Beastwright.

# How beasts help. A bonded beast can assist one crafting or gathering task per day.
beast_abilities:
  by_family:
    - { family: rodent, name: "Fine Gnawing", effect: "Advantage on Talisman Carving checks." }
    - { family: bovine, name: "Bellows and Millstone", effect: "Smithing and Kilnwork take half time." }
    - { family: feline, name: "Precise Claw", effect: "+2 to inscription work on masterwork pieces." }
    - { family: lagomorph, name: "Lucky Find", effect: "Reroll one failed gathering check per day." }
    - { family: reptilian, name: "Patient Shedding", effect: "Gives one tier-1 hide or scale material per long rest." }
    - { family: equine, name: "Packbearer", effect: "Carries up to 10× its weight class in materials; travel to a market takes half time." }
    - { family: caprine, name: "Cliff Forager", effect: "Advantage on gathering checks for minerals and jade." }
    - { family: primate, name: "Deft Hands", effect: "Counts as a second crafter (halves time) for Weaving and Hidework." }
    - { family: avian, name: "Moult Gift", effect: "Gives one feather material of its form's element per long rest." }
    - { family: canine, name: "Keen Nose", effect: "Advantage on gathering checks to find materials (Tracking)." }
    - { family: suine, name: "Forager", effect: "Finds one tier-1 material of its choice per day of travel." }
    - { family: piscine, name: "Pearl Diver", effect: "Advantage on gathering checks for shell and mother-of-pearl." }
    - { family: insectoid, name: "Silk Spinner", effect: "Gives one silk or fibre material per long rest." }
    - { family: chelonian, name: "Slow Cure", effect: "Lacquerwork curing time is halved." }
  by_element_form:
    - { element: wood, name: "Green Thumb", effect: "Grown materials (rattan, bamboo, peach wood) are found on any gathering success." }
    - { element: fire, name: "Living Forge", effect: "Heats a forge or kiln with no fuel; +1 to Smithing and Kilnwork checks." }
    - { element: earth, name: "Steady Ground", effect: "+1 to Kilnwork checks; ceramic pieces gain +1 durability." }
    - { element: metal, name: "Edge Sense", effect: "+1 to Smithing checks; spots flaws, so a failed Smithing check loses no materials." }
    - { element: water, name: "Quench", effect: "+2 to Smithing checks for metal pieces (a perfect quench)." }

