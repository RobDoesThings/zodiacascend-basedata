# DRAFT for review. Vessel spirits: non-playable, single-use creatures that exist in exactly one
# element, one confluence (two-element blend) or the celestial Eclipse type.
#
# How they work (all modes):
#   1. Encounter: a spirit appears (wild event, Lure card, or GM).
#   2. Capture: the Keeper must hold an empty vessel it fits. Vessel Check:
#      d20 + Keeper's WIS modifier + the vessel's capture bonus >= the spirit's capture DC.
#   3. Hold: the spirit stays in its vessel for at most hold_rounds rounds of battle (or one day
#      outside battle). If it is not released in time, it slips free with no effect.
#   4. Release: an action. The release effect happens once, the spirit goes free, and the vessel
#      is spent. A released spirit cannot be captured again in the same battle or day.
#
# vessel_mode: "held" spirits sit inside the vessel. "token" spirits are too great or too
# revered to confine: the vessel holds a pledge (a song, a scale, a feather) and releasing it
# calls the spirit for a single favour.

spirits:
  # ---------- Fish ----------
  - id: gatecarp
    name: Gatecarp
    creature: fish
    element: water
    size: small
    weight_kg: 6
    size_cm: 70
    measure: length
    capture_dc: 12
    hold_rounds: 3
    vessel: bamboo-creel
    vessel_mode: held
    temperament: proud
    release:
      card_text: Release. One of your Kits or Adepts may evolve now if it meets the level requirement, ignoring the item.
      rules_text: >-
        When released, the Gatecarp leaps once more. Choose one of your active Kits or Adepts that
        meets the level requirement of its next stage; it evolves immediately, without the
        Element Shard or Zodiac Seal. The Trial of the Hour is still required for Stage III.
    folklore_sources:
      - region: China
        tradition: The carp that leaps the falls at the Dragon Gate on the Yellow River and becomes a dragon.
    lore: >-
      A Gatecarp has tried to leap the Dragon Gate ninety-nine times and fallen ninety-nine times.
      It no longer wants to become a dragon. It wants to see someone else make it, and it gives
      its leap away to anyone who will carry it upstream.

  - id: needlefin-shoal
    name: Needlefin Shoal
    creature: fish (swordfish shoal)
    element: metal
    size: large
    weight_kg: 90
    size_cm: 280
    measure: length
    capture_dc: 15
    hold_rounds: 2
    vessel: bamboo-creel
    vessel_mode: held
    temperament: bold
    release:
      card_text: Release. Every foe in a 30 ft line takes 4d8 damage (DEX save for half).
      rules_text: >-
        The shoal bursts out in a straight line 30 ft long. Each foe in the line makes a DEX save
        against DC 15, taking 4d8 damage on a failure or half on a success. A foe behind a Ward
        or Rooted beast takes no damage.
    folklore_sources:
      - region: Malay world (Singapore)
        tradition: The Malay Annals tell how swordfish (todak) attacked Singapura, until a boy suggested a wall of banana trunks to catch their beaks.
    lore: >-
      Needlefins hunt in shoals that move like a single blade. Coastal villages still plant a row
      of banana trunks along the shore in the swordfish season, and they still tell of the clever
      child who first thought of it, and of how badly the kingdom repaid him.

  - id: thornpuff
    name: Thornpuff
    creature: fish (pufferfish)
    confluence: frost
    size: tiny
    weight_kg: 1.5
    size_cm: 35
    measure: length
    capture_dc: 11
    hold_rounds: 4
    vessel: bamboo-creel
    vessel_mode: held
    temperament: wary
    release:
      card_text: Release. Each foe in melee with your beasts is Poisoned for 2 rounds.
      rules_text: >-
        The Thornpuff inflates and fires its frozen spines. Every foe within 5 ft of one of your
        active beasts makes a CON save against DC 13 or becomes Poisoned for 2 rounds.
    folklore_sources:
      - region: East Asia
        tradition: The pufferfish, a delicacy so dangerous that only licensed cooks may prepare it.
    lore: >-
      Thornpuffs drift in the cold currents beneath winter ice. They are harmless until frightened,
      and they are frightened of almost everything.

  # ---------- Snails ----------
  - id: moonshell-snail
    name: Moonshell Snail
    creature: snail (sea snail)
    confluence: silt
    size: small
    weight_kg: 3
    size_cm: 30
    measure: length
    capture_dc: 13
    hold_rounds: 5
    vessel: clay-jar
    vessel_mode: held
    temperament: serene
    release:
      card_text: Release. Choose a beast; it becomes Rooted and gains +4 Guard for 2 rounds.
      rules_text: >-
        The snail seals one of your active beasts in a shell of hardened silt. That beast gains
        +4 Guard and becomes Rooted for 2 rounds.
    folklore_sources:
      - region: Japan
        tradition: The belief that a turban snail that lives thirty years in the sea becomes a spirit (sazae-oni).
    lore: >-
      A Moonshell Snail has lived thirty years on the estuary floor, and the moonlight that
      filters down has settled into its shell. It moves a hand's width a day and has outlived
      every fisherman who ever tried to eat it.

  - id: rain-snail
    name: Rain Snail
    creature: snail (land snail)
    confluence: mangrove
    size: tiny
    weight_kg: 0.2
    size_cm: 12
    measure: length
    capture_dc: 10
    hold_rounds: 5
    vessel: clay-jar
    vessel_mode: held
    temperament: gentle
    release:
      card_text: Release. Heal each of your active beasts 2d6 and end Burning on them.
      rules_text: >-
        The Rain Snail calls a gentle rain over your side of the field. Each of your active beasts
        regains 2d6 HP and stops Burning. Your beasts become Soaked for 1 round.
    folklore_sources:
      - region: Vietnam and China
        tradition: The Snail Maiden (Nàng Ốc; 田螺姑娘), a snail kept kindly in a jar who secretly comes out to cook and clean for the lonely person who saved it.
    lore: >-
      A Rain Snail kept kindly in a jar will, one day, slip out while you sleep and leave the house
      swept, the rice cooked and the garden watered. Keepers who catch it in the act are thanked
      with rain and never see it again.

  # ---------- Octopus, shark, whales ----------
  - id: crimson-tidemother
    name: Crimson Tidemother
    creature: octopus
    element: water
    size: huge
    weight_kg: 400
    size_cm: 900
    measure: length
    capture_dc: 18
    hold_rounds: 2
    vessel: conch-of-calling
    vessel_mode: token
    temperament: proud
    release:
      card_text: Release. Every active foe is Restrained for 1 round (STR save negates).
      rules_text: >-
        Eight crimson arms rise from the ground and seize the field. Every active foe makes a STR
        save against DC 16 or becomes Restrained for 1 round.
    folklore_sources:
      - region: Hokkaido (Ainu)
        tradition: The great red octopus of Uchiura Bay, whose colour is said to stain the sea and sky.
    lore: >-
      When the bay turns red at evening, fisherfolk say the Tidemother has surfaced. She cannot be
      confined; a Keeper who earns her favour carries one of her shed suckers in a conch, and she
      answers its call exactly once.

  - id: hooktail-shark
    name: Hooktail Shark
    creature: shark
    confluence: frost
    size: large
    weight_kg: 350
    size_cm: 450
    measure: length
    capture_dc: 16
    hold_rounds: 2
    vessel: bamboo-creel
    vessel_mode: held
    temperament: sly
    release:
      card_text: Release. Pull one foe's active beast to the bench and pull its benched beast in.
      rules_text: >-
        The shark's barbed tail hooks one active foe and drags it under. Swap that beast with one
        of its owner's benched beasts (you choose which). The dragged beast takes 2d6 damage.
    folklore_sources:
      - region: Japan
        tradition: The isonade of the western coasts, a huge sea creature that hooks sailors from their boats with its barbed tail fin.
    lore: >-
      Sailors never see the Hooktail itself, only the barbed fin rising beside the boat. The only
      safe course is to keep it busy, and some Keepers have learned to point it at their enemies.

  - id: harbour-grandfather
    name: Harbour Grandfather
    creature: whale
    element: water
    size: huge
    weight_kg: 40000
    size_cm: 1500
    measure: length
    cv: 0.15
    capture_dc: 20
    hold_rounds: 3
    vessel: conch-of-calling
    vessel_mode: token
    temperament: gentle
    release:
      card_text: Release. Return one defeated beast to your bench at half HP. It does not count as defeated.
      rules_text: >-
        The Grandfather rises beneath the field and carries a fallen beast home. Return one of your
        defeated beasts to your bench with half its maximum HP and no conditions. It no longer
        counts toward your opponent's defeats.
    folklore_sources:
      - region: Vietnam
        tradition: Cá Ông, the whale venerated by coastal fishing communities as a rescuer of those lost at sea; whales that wash ashore are given funerals and enshrined in whale temples.
    lore: >-
      Coastal villages in the Hour of the Pig keep shrines to the Harbour Grandfather and bury any
      whale that washes ashore with full honours. It is never caught. A Keeper who has done the
      sea a kindness may be given a conch that holds its song, and when they blow it, the
      Grandfather comes to carry someone home.

  - id: wingwhale
    name: Wingwhale
    creature: whale (becomes a bird)
    element: water
    becomes: metal
    size: huge
    weight_kg: 60000
    size_cm: 3000
    measure: length
    cv: 0.2
    capture_dc: 22
    hold_rounds: 1
    vessel: conch-of-calling
    vessel_mode: token
    temperament: serene
    release:
      card_text: Release. Replace the Field with any Field from your deck or discard. Your beasts gain +10 ft Speed this round.
      rules_text: >-
        The Wingwhale breaches as a fish and rises as a bird, and the wind of its wings changes the
        world below. Search your deck or discard pile for a Field and play it, replacing the
        current one. Your active beasts gain +10 ft Speed until the end of the round.
    folklore_sources:
      - region: China
        tradition: The Zhuangzi's Kun, a fish of the northern dark sea thousands of li long, which transforms into Peng, a bird whose wings are like clouds across the sky.
    lore: >-
      In the northern dark sea lives a fish too long to measure. Once in a great age it becomes a
      bird and flies south, and the weather of the whole world turns with it. It counts as Water
      while it swims and Metal once it has flown.

  # ---------- Cats ----------
  - id: forktail-elder
    name: Forktail Elder
    creature: cat
    confluence: kindle
    size: small
    weight_kg: 6
    size_cm: 90
    measure: length
    capture_dc: 15
    hold_rounds: 3
    vessel: lantern-cage
    vessel_mode: held
    temperament: sly
    release:
      card_text: Release. Take control of one foe Kit or Wanderer until the end of your next turn.
      rules_text: >-
        The Forktail dances on its hind legs and a foe dances with it. One active foe Kit or
        Wanderer makes a WIS save against DC 15 or becomes Charmed by you and acts on your turn as
        you direct until the end of your next turn. It cannot use techniques costing more than
        2 Qi, and the effect ends early if it takes damage.
    folklore_sources:
      - region: Japan
        tradition: The nekomata, a cat that grows a forked tail in great old age and gains strange powers, including making things dance.
    lore: >-
      A cat that lives long enough grows a second tail, and with it a sense of humour nobody else
      shares. The Forktail Elder lights the lantern it is kept in and leaves only when it is bored.

  - id: beckoning-cat
    name: Beckoning Cat
    creature: cat
    confluence: ore
    size: tiny
    weight_kg: 4
    size_cm: 70
    measure: length
    capture_dc: 12
    hold_rounds: 4
    vessel: lacquer-box
    vessel_mode: held
    temperament: playful
    release:
      card_text: Release. Draw 2 cards. Your next Bond Check this battle has advantage.
      rules_text: >-
        The cat raises one paw and fortune follows. Draw 2 cards. The next Bond Check you make
        before the end of the battle has advantage. In tabletop play, gain 1 Inspiration instead
        of drawing.
    folklore_sources:
      - region: Japan
        tradition: The maneki-neko, the beckoning cat said to have waved a lord into Gōtoku-ji temple moments before lightning struck where he had been standing.
    lore: >-
      A Beckoning Cat waves you over just before something terrible happens where you were
      standing. Shopkeepers keep porcelain copies by the till, but the real thing is made of ore
      and coin and is very hard to find.

  - id: silverpoint-cat
    name: Silverpoint Cat
    creature: cat
    element: metal
    size: tiny
    weight_kg: 4
    size_cm: 70
    measure: length
    capture_dc: 13
    hold_rounds: 3
    vessel: rattan-cage
    vessel_mode: held
    temperament: serene
    release:
      card_text: Release. The Field becomes Monsoon Delta for 2 rounds. Your active beasts gain 2 Qi.
      rules_text: >-
        The cat's arrival brings rain. For 2 rounds the Field is Monsoon Delta, after which the
        previous Field returns. Each of your active beasts gains 2 Qi.
    folklore_sources:
      - region: Thailand
        tradition: The Cat-Book Poems (Tamra Maew), which describe lucky cats such as the silver-blue Si Sawat, and the folk rain ritual (Hae Nang Maew) in which a cat is carried through the village in a basket and splashed with water to call the rain.
    lore: >-
      A silver-blue cat with eyes like young rice. In dry years villages carry one through the
      streets in a rattan basket and splash it with water, and the rains come. The cat, for its
      part, considers this undignified but effective.

  # ---------- Birds ----------
  - id: shrine-dove
    name: Shrine Dove
    creature: dove
    element: metal
    size: tiny
    weight_kg: 0.3
    size_cm: 32
    measure: length
    capture_dc: 10
    hold_rounds: 5
    vessel: rattan-cage
    vessel_mode: held
    temperament: gentle
    release:
      card_text: Release. Truce. No beast may attack or use a damaging technique until the end of the next round.
      rules_text: >-
        The white dove circles the field and every beast lowers its guard. Until the end of the
        next round, no beast can make an attack or use a technique that deals damage. Healing,
        buffs, swaps and card play continue.
    folklore_sources:
      - region: Japan
        tradition: Doves as messengers of Hachiman, the god of archery and protection; the first character of Hachiman's name is often drawn as a pair of doves.
    lore: >-
      Shrine Doves nest in the eaves of warrior shrines, which is why warriors bow to them. When
      one is released over a battlefield, even Sovereigns stop to watch it go.

  - id: pebble-finch
    name: Pebble Finch
    creature: bird (finch)
    element: earth
    size: tiny
    weight_kg: 0.05
    size_cm: 15
    measure: length
    capture_dc: 10
    hold_rounds: 5
    vessel: rattan-cage
    vessel_mode: held
    temperament: stubborn
    release:
      card_text: Release. End any Water Field; until replaced, the Field is Terraced Rice Fields.
      rules_text: >-
        The finch drops one pebble, then another, then a thousand. If the current Field is a Water
        Field, it ends and Terraced Rice Fields replaces it. Otherwise, your active beasts gain
        +1 Guard for 2 rounds.
    folklore_sources:
      - region: China
        tradition: Jingwei, a princess who drowned in the Eastern Sea and became a bird that carries pebbles and twigs to fill the sea, forever.
    lore: >-
      A Pebble Finch carries one stone at a time to the sea and drops it in. It has been doing this
      for longer than anyone remembers, and it does not intend to stop until the sea is gone.

  - id: three-step-sunrook
    name: Three-Step Sunrook
    creature: bird (crow)
    element: fire
    size: small
    weight_kg: 1.5
    size_cm: 60
    measure: length
    capture_dc: 16
    hold_rounds: 2
    vessel: lantern-cage
    vessel_mode: held
    temperament: proud
    release:
      card_text: Release. Every foe makes a CON save or is Blinded and Burning for 1 round.
      rules_text: >-
        The three-legged crow flies up and becomes, briefly, the sun. Every active foe makes a CON
        save against DC 16 or becomes Blinded and Burning for 1 round. Hidden beasts become
        Exposed.
    folklore_sources:
      - region: China, Korea and Japan
        tradition: The three-legged crow that lives in the sun (sanzuwu; samjok-o; yatagarasu), and the legend of the archer who shot down nine of ten suns.
    lore: >-
      Once there were ten suns and each was a crow. An archer shot nine of them down. The Sunrooks
      are their descendants, smaller and humbler, and they are still afraid of bows.

  # ---------- Other folklore spirits ----------
  - id: gulfmaw
    name: Gulfmaw
    creature: sea serpent
    celestial: eclipse
    size: huge
    weight_kg: 5000
    size_cm: 4000
    measure: length
    cv: 0.2
    capture_dc: 21
    hold_rounds: 1
    vessel: temple-drum
    vessel_mode: token
    temperament: restless
    release:
      card_text: Release. The Field becomes Eclipse of the Hour.
      rules_text: >-
        The serpent rises and swallows the moon. The Field becomes Eclipse of the Hour (the control
        cycle reverses for 3 rounds, then the previous Field returns). Any player may end the
        eclipse early by discarding 2 cards ("beating the drums").
    folklore_sources:
      - region: Philippines (Visayas)
        tradition: The Bakunawa, a sea serpent that rises to swallow the moon, and the custom of beating pots and drums to make it spit the moon back out.
    lore: >-
      The Gulfmaw once swallowed six of seven moons. People saved the last one by beating every pot
      and drum they owned. It is never caught; a Keeper may only carry the drum that once drove it
      off, and beat it to call the Gulfmaw back for one hungry moment.

  - id: dreamgrazer
    name: Dreamgrazer
    creature: tapir-like spirit
    confluence: mangrove
    size: medium
    weight_kg: 200
    size_cm: 200
    measure: length
    capture_dc: 14
    hold_rounds: 3
    vessel: pillow-box
    vessel_mode: held
    temperament: serene
    release:
      card_text: Release. End Frightened and Charmed on all your beasts. They can't gain either for 2 rounds.
      rules_text: >-
        The Dreamgrazer eats the bad dreams of everyone on your side. End Frightened and Charmed on
        each of your beasts; they are immune to both conditions for 2 rounds.
    folklore_sources:
      - region: Japan (from China)
        tradition: The baku, a chimera that devours nightmares; people once kept its picture under their pillows.
    lore: >-
      A Dreamgrazer wanders the edge of sleep eating nightmares. It is kept in a pillow box, and
      children who sleep on the box wake rested. It prefers the dreams of the frightened; they are
      the sweetest.

  - id: goldmaw
    name: Goldmaw
    creature: winged lion
    confluence: ore
    size: medium
    weight_kg: 150
    size_cm: 180
    measure: length
    capture_dc: 17
    hold_rounds: 3
    vessel: lacquer-box
    vessel_mode: held
    temperament: proud
    release:
      card_text: Release. Gain Qi equal to all Qi your foes spent last turn, shared among your beasts.
      rules_text: >-
        The Goldmaw devours wealth and never gives it up. Count the Qi your opponent's beasts
        spent during their last turn; distribute that much Qi among your active beasts (no beast
        above its maximum).
    folklore_sources:
      - region: China
        tradition: The pixiu, a winged lion that eats gold and silver and never lets any out, kept as a charm to attract and hold wealth.
    lore: >-
      A Goldmaw eats coin and never spends it. Merchants keep its image facing the door so that
      money comes in. Keepers who catch a real one find their purses mysteriously heavier, and
      their enemies' oddly light.

  - id: truthmane
    name: Truthmane
    creature: lion-dog spirit
    element: water
    size: large
    weight_kg: 300
    size_cm: 220
    measure: length
    capture_dc: 17
    hold_rounds: 3
    vessel: lacquer-box
    vessel_mode: held
    temperament: stubborn
    release:
      card_text: Release. Reveal all set cards. Negate one Snare or Omen. All Hidden foes become Exposed.
      rules_text: >-
        The Truthmane sees through every deceit. Your opponent reveals all their set cards; choose
        one Snare or Omen and destroy it. Every Hidden foe becomes Exposed. Decoys on the field
        vanish.
    folklore_sources:
      - region: Korea
        tradition: The haetae (haechi), a lion-like beast that tells right from wrong and butts the guilty; its statues guard Gyeongbokgung palace, where they were believed to protect the palace from fire.
    lore: >-
      The Truthmane cannot abide a lie. It butts liars, eats fire and guards the halls of judges.
      Keepers who carry one must be careful: it does not always distinguish between their enemies'
      deceptions and their own.

  - id: riverhop-mousedeer
    name: Riverhop Mousedeer
    creature: mousedeer
    element: wood
    size: tiny
    weight_kg: 2
    size_cm: 50
    measure: length
    capture_dc: 13
    hold_rounds: 4
    vessel: rattan-cage
    vessel_mode: held
    temperament: sly
    release:
      card_text: Release. Swap any two active beasts on the field (yours or your foe's). Neither provokes.
      rules_text: >-
        The mousedeer talks its way across. Choose any two active beasts, on either side, and swap
        their slots. If both belong to different players, they stay with their own Keepers but
        trade positions in the line.
    folklore_sources:
      - region: Malay world (Malaysia, Indonesia, Brunei)
        tradition: Sang Kancil, the trickster mousedeer, who crosses a river by persuading the crocodiles to line up so the King can "count" them.
    lore: >-
      The smallest deer in the forest is the cleverest beast in it. A Riverhop Mousedeer has
      talked its way out of every cage it has ever been in, which is why Keepers release it before
      it gets the chance.

  - id: lampsquid
    name: Lampsquid
    creature: squid
    confluence: steam
    size: tiny
    weight_kg: 0.01
    size_cm: 7
    measure: length
    capture_dc: 11
    hold_rounds: 3
    vessel: lantern-cage
    vessel_mode: held
    temperament: playful
    release:
      card_text: Release. All Hidden foes become Exposed. Ranged attacks have advantage this round.
      rules_text: >-
        A swarm of tiny squid lights the field in blue fire. Every Hidden foe becomes Exposed, and
        ranged attacks have advantage until the end of the round.
    folklore_sources:
      - region: Japan
        tradition: The firefly squid of Toyama Bay, whose spring spawning lights the shoreline blue.
    lore: >-
      Each spring the Lampsquid rise from the deep and light the bay with blue fire. One in a
      lantern cage is enough to read by.

  - id: blinkswarm
    name: Blinkswarm
    creature: firefly swarm
    confluence: kindle
    size: medium
    weight_kg: 0.5
    size_cm: 300
    measure: length
    capture_dc: 12
    hold_rounds: 4
    vessel: lantern-cage
    vessel_mode: held
    temperament: playful
    release:
      card_text: Release. All foes make a WIS save or are Blinded for 1 round. Your beasts become Hidden.
      rules_text: >-
        Thousands of fireflies flash in perfect time. Every active foe makes a WIS save against DC
        14 or becomes Blinded for 1 round. Each of your active beasts becomes Hidden.
    folklore_sources:
      - region: Malaysia
        tradition: The synchronous fireflies of the Selangor River mangroves, which flash in unison on the riverbank trees.
    lore: >-
      On moonless nights the mangrove trees along the river light up all at once, then go dark,
      then light again. A Keeper can catch the rhythm in a lantern, but not for long.

  - id: mossback-tortoise
    name: Mossback Tortoise
    creature: tortoise
    confluence: moss
    size: medium
    weight_kg: 120
    size_cm: 120
    measure: length
    capture_dc: 14
    hold_rounds: 5
    vessel: clay-jar
    vessel_mode: held
    temperament: serene
    release:
      card_text: Release. One of your beasts gains 15 temporary HP and cannot drop below 1 HP this round.
      rules_text: >-
        The ancient tortoise lends a beast its years. One of your active beasts gains 15 temporary
        HP and cannot drop below 1 HP until the end of the round.
    folklore_sources:
      - region: Japan
        tradition: The minogame, a tortoise so old that seaweed grows from its shell like a long tail; a symbol of long life.
    lore: >-
      A Mossback Tortoise has carried the same moss for a thousand years. It trails behind it like
      a green cloak. Old Keepers say that touching the moss adds a day to your life, and the
      tortoise has never contradicted them.

  - id: ironeater
    name: Ironeater
    creature: iron-eating beast
    confluence: forge
    size: large
    weight_kg: 800
    size_cm: 300
    measure: length
    capture_dc: 19
    hold_rounds: 2
    vessel: clay-jar
    vessel_mode: held
    temperament: restless
    release:
      card_text: Release. Destroy all Talismans on foes. Steel-form foes take 3d6 damage.
      rules_text: >-
        The Ironeater bursts from its jar and devours every scrap of metal in sight. Destroy every
        Talisman attached to a foe. Every active foe in Metal form takes 3d6 damage.
    folklore_sources:
      - region: Korea
        tradition: The bulgasari, a creature shaped from grains of rice that eats iron and grows larger with every meal.
    lore: >-
      The Ironeater began as a figure of rice pressed between a lonely man's fingers. It ate a
      needle, then a pot, then the bells of the town. It is kept in clay because clay is the only
      thing it will not eat.

  - id: jewelwing-beetle
    name: Jewelwing Beetle
    creature: beetle
    confluence: lacquer
    size: tiny
    weight_kg: 0.01
    size_cm: 4
    measure: length
    capture_dc: 11
    hold_rounds: 5
    vessel: lacquer-box
    vessel_mode: held
    temperament: proud
    release:
      card_text: Release. Attach to one of your beasts. It gains +2 Guard until it is next hit.
      rules_text: >-
        The beetle settles on one of your active beasts and covers it in iridescent lacquer. That
        beast gains +2 Guard. The bonus ends the first time an attack hits it.
    folklore_sources:
      - region: Japan
        tradition: The Tamamushi Shrine at Hōryū-ji, a seventh-century cabinet once decorated with thousands of iridescent jewel-beetle wings.
    lore: >-
      Craftsmen once covered a shrine in Jewelwing wing-cases until it shone like a rainbow. The
      beetles have never quite forgiven them, but they do enjoy being admired.

vessels:
  - id: bamboo-creel
    name: Bamboo Creel
    holds: Fish and sea creatures of small to large size.
    capture_bonus: 2
    lore: A woven bamboo fish trap with a funnel mouth, of the kind set in rivers and paddies across Southeast Asia.
  - id: clay-jar
    name: Clay Jar
    holds: Snails, tortoises and things that must not touch metal.
    capture_bonus: 1
    lore: A lidded earthenware jar, the kind in which kindly folk once kept a snail and found their house cleaned.
  - id: lantern-cage
    name: Lantern Cage
    holds: Spirits of light and fire.
    capture_bonus: 1
    lore: A paper lantern with a woven bamboo frame. A spirit inside makes it glow.
  - id: rattan-cage
    name: Rattan Cage
    holds: Birds and small, quick beasts.
    capture_bonus: 2
    lore: A woven rattan cage of the kind used to carry songbirds — or, in dry years, a rain-calling cat.
  - id: lacquer-box
    name: Lacquer Box
    holds: Small spirits of fortune, metal and judgement.
    capture_bonus: 0
    lore: A black-and-red lacquered box with a jade clasp. The finer the lacquer, the more respectful the invitation.
  - id: pillow-box
    name: Pillow Box
    holds: Spirits of sleep and dream.
    capture_bonus: 1
    lore: A hollow ceramic headrest. A spirit of dreams sleeps inside it as long as someone sleeps on it.
  - id: conch-of-calling
    name: Conch of Calling
    holds: A pledge from a great sea spirit (token only).
    capture_bonus: 0
    lore: A great conch shell. It holds no creature, only a promise and a song.
  - id: temple-drum
    name: Temple Drum
    holds: A pledge from a celestial spirit (token only).
    capture_bonus: 0
    lore: A small hand drum, said to be one of those once beaten to drive a moon-swallower away.
