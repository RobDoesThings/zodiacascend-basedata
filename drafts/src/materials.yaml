# DRAFT for review. Crafting materials.
#
# Beasts are bonded, never harvested: nothing here comes from defeating or killing a beast.
# Animal materials are shed (moulted feathers, shed skin, cast horns, fallen scales), given by a
# bonded beast during a long rest, or gifted by a Sovereign after its Trial.
#
# tier: 1 common · 2 uncommon · 3 rare · 4 legendary (gift only; can never be sold for real money)
# role: what part of a piece the material can be — frame, facing, binding, padding or finish.
# value is in strings of cash (a string = 1000 copper coins), the in-world currency.
# Gather DC by tier: 1 → 10, 2 → 13, 3 → 16, 4 → story only.

materials:
