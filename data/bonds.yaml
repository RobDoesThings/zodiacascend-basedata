# Zodiac bonds between the twelve animals of the Vietnamese zodiac. These follow the traditional groupings:
# Trines are the Three Harmonies (each gathers into one element), Kindred pairs are the
# Six Harmonies, and Rivals are the Six Clashes (animals opposite each other on the wheel).
# Combo moves for Kindred pairs are added with the move system.
# Content licence: CC BY 4.0.

effects:
  trine:
    requires: all_members_active
    guard_bonus: 2
    shared_qi_pool: true
    rules_text: >-
      While all three members of a Trine are active on the same side, each gains +2 Guard and they
      draw on one shared Qi pool equal to the sum of their current Qi. Regeneration still happens per
      beast, into the shared pool.
  kindred:
    requires: both_members_active
    unlocks: combo_move
    rules_text: >-
      While both members of a Kindred pair are active on the same side, either may use the pair's
      combo technique. Both beasts spend their action on it, and its Qi cost may be paid from either
      beast or split between them.
  rival:
    to_hit_bonus_vs_rival: 2
    same_team_guard_penalty: -2
    rules_text: >-
      A beast gains +2 to attack rolls against its Rival. Two Rivals active on the same side each
      take −2 Guard while both remain active.

trines:
  - id: trine-of-water
    name: Trine of Water
    members: [rat, dragon, monkey]
    description: The quick-witted. The Rat begins it, the Dragon gives it force, the Monkey finishes it.
  - id: trine-of-metal
    name: Trine of Metal
    members: [buffalo, snake, rooster]
    description: The resolute. Each keeps to its course and finishes what it starts.
  - id: trine-of-fire
    name: Trine of Fire
    members: [tiger, horse, dog]
    description: The brave. They run toward trouble and stand by each other within it.
  - id: trine-of-wood
    name: Trine of Wood
    members: [cat, goat, pig]
    description: The gentle. They heal, shelter and feed those around them.

kindred:
  - id: kindred-rat-buffalo
    name: Rider and Road
    members: [rat, buffalo]
    description: The Rat rode the Buffalo across the river in the Great Race. The Buffalo still carries it, and neither minds.
  - id: kindred-tiger-pig
    name: Hunter and Hearth
    members: [tiger, pig]
    description: The Tiger hunts and the Pig feeds the camp; each keeps the other whole.
  - id: kindred-cat-dog
    name: Moon and Watchfire
    members: [cat, dog]
    description: The Cat mends what the Dog defends, and the two share the hearth without a single argument.
  - id: kindred-dragon-rooster
    name: Heaven and Dawn
    members: [dragon, rooster]
    description: The Rooster calls up the sun that the Dragon rides.
  - id: kindred-snake-monkey
    name: Coil and Mirror
    members: [snake, monkey]
    description: Two cunning minds who respect each other's tricks.
  - id: kindred-horse-goat
    name: Gallop and Summit
    members: [horse, goat]
    description: The Horse crosses the plain and the Goat climbs the peak; together they reach everywhere.

rivals:
  - id: rivals-rat-horse
    members: [rat, horse]
    description: Midnight and noon, opposite on the wheel of hours.
  - id: rivals-buffalo-goat
    members: [buffalo, goat]
    description: Two stubborn grazers who will not yield the same pasture.
  - id: rivals-tiger-monkey
    members: [tiger, monkey]
    description: Brute strength against mocking cleverness.
  - id: rivals-cat-rooster
    members: [cat, rooster]
    description: The night-prowler of the moon against the herald of the sun.
  - id: rivals-dragon-dog
    members: [dragon, dog]
    description: Heaven's pride against the earthbound guardian who will not bow.
  - id: rivals-snake-pig
    members: [snake, pig]
    description: The cold and the warm-hearted, who never understand each other.
